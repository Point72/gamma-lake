[package]
name = "gamma_lake_py"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
publish = false

[lib]
name = "gammalake"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
gamma_lake = { path = "./rust", version = "*", features = ["mimalloc"] }
pyo3 = { version = "0.29.2", features = ["abi3", "extension-module", "multiple-pymethods"] }
# DataFusion's FFI, for `FeatureTable.__datafusion_table_provider__`. It must match the
# DataFusion version of the core (through deltalake), and datafusion-python must have the same
# major version.
# Its parquet feature must match datafusion-common's, which deltalake enables.
datafusion-ffi = "=55.2.0"

# Panics unwind (no `panic = "abort"`) so PyO3 can surface them as Python exceptions
# instead of terminating the host process.
[profile.release]
lto = "thin"
# Drops the symbol table (about 45 MB); exported symbols stay. Panic backtraces lose function
# names.
strip = "symbols"
